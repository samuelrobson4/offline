version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eventsync-postgres
    environment:
      POSTGRES_USER: eventsync
      POSTGRES_PASSWORD: eventsync
      POSTGRES_DB: eventsync
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eventsync']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eventsync-backend
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://eventsync:eventsync@postgres:5432/eventsync
      JWT_SECRET: development-secret
      JWT_REFRESH_SECRET: development-refresh-secret
      FRONTEND_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eventsync-frontend
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:3001
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev

volumes:
  postgres_data:
